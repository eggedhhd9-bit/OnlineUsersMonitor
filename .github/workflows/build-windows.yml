name: Build Staff Attendance for Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-build.txt
      - run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name StaffAttendance staff_attendance.py
      - uses: actions/upload-artifact@v4
        with:
          name: StaffAttendance-windows
          path: dist/StaffAttendance.exe
